<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="360" fill="#f4f7ff"/>

  <!-- ground line -->
  <line x1="40" y1="300" x2="860" y2="300" stroke="#c7d5f5" stroke-width="2"/>

  <!-- 1. Outdoor antenna -->
  <g transform="translate(70,120)">
    <line x1="30" y1="0" x2="30" y2="130" stroke="#1c328c" stroke-width="6"/>
    <line x1="10" y1="20" x2="50" y2="20" stroke="#1c328c" stroke-width="6"/>
    <line x1="30" y1="0" x2="10" y2="-18" stroke="#1c328c" stroke-width="6"/>
    <line x1="30" y1="0" x2="50" y2="-18" stroke="#1c328c" stroke-width="6"/>
    <g stroke="#5a8bff" stroke-width="3" fill="none">
      <path d="M-10 -10 q40 -30 80 0"/>
      <path d="M-22 2 q52 -42 104 0"/>
    </g>
  </g>

  <!-- cable 1 -->
  <path d="M130 250 Q 200 280 270 250" stroke="#8ab2ff" stroke-width="3" stroke-dasharray="4 6" fill="none"/>

  <!-- 2. Amplifier box -->
  <g transform="translate(270,200)">
    <rect width="90" height="70" rx="10" fill="#1f47dd"/>
    <rect x="14" y="18" width="62" height="10" rx="3" fill="#8ab2ff"/>
    <rect x="14" y="36" width="40" height="10" rx="3" fill="#8ab2ff"/>
    <circle cx="70" cy="52" r="5" fill="#12946f"/>
  </g>

  <!-- cable 2 -->
  <path d="M360 235 Q 430 260 500 235" stroke="#8ab2ff" stroke-width="3" stroke-dasharray="4 6" fill="none"/>

  <!-- 3. Indoor antenna -->
  <g transform="translate(500,190)">
    <ellipse cx="40" cy="80" rx="46" ry="10" fill="#dae7ff"/>
    <line x1="40" y1="20" x2="40" y2="80" stroke="#1c328c" stroke-width="6"/>
    <circle cx="40" cy="14" r="10" fill="#ff5a1f"/>
    <g stroke="#ff5a1f" stroke-width="2.5" fill="none" opacity="0.8">
      <path d="M18 14 q22 -18 44 0"/>
      <path d="M8 14 q32 -28 64 0"/>
    </g>
  </g>

  <!-- 4. Coverage room -->
  <g transform="translate(640,120)">
    <rect width="180" height="150" rx="10" fill="white" stroke="#c7d5f5" stroke-width="2"/>
    <g stroke="#12946f" stroke-width="2.5" fill="none" opacity="0.9">
      <path d="M30 110 q60 -70 120 0"/>
      <path d="M50 120 q40 -46 80 0"/>
      <path d="M70 130 q20 -22 40 0"/>
    </g>
  </g>

  <!-- labels -->
  <text x="100" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0a1338" text-anchor="middle">Outdoor Antenna</text>
  <text x="315" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0a1338" text-anchor="middle">Amplifier</text>
  <text x="540" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0a1338" text-anchor="middle">Indoor Antenna</text>
  <text x="730" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0a1338" text-anchor="middle">Improved Coverage</text>
</svg>
